<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Encodage des caractères en UTF-8 pour une compatibilité maximale -->
    <meta charset="utf-8" />

    <!-- Favicon du site, affiché dans l'onglet du navigateur -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Permet un rendu responsive sur tous les types d'écrans -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Couleur de thème pour les navigateurs mobiles (barre d'adresse, etc.) -->
    <meta name="theme-color" content="#000000" />

    <!-- Description du site pour les moteurs de recherche et partages sociaux -->
    <meta
      name="description"
      content="Web site created using create-react-app"
    />

    <!-- Icône pour les appareils Apple (écran d'accueil iOS) -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- 
      Fichier de manifeste pour les Progressive Web Apps (PWA).
      Contient les métadonnées nécessaires à l'installation de l'application.
      Plus d'infos : https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- 
      %PUBLIC_URL% est une variable utilisée par create-react-app.
      Elle est remplacée automatiquement par l'URL correcte lors du build.
      N'utilise cette syntaxe que pour des fichiers situés dans le dossier public.
    -->

    <!-- Titre affiché dans l'onglet du navigateur -->
    <title>React App</title>
  </head>
  <body>
    <!-- Message affiché si JavaScript est désactivé dans le navigateur -->
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Élément racine dans lequel l'application React sera injectée -->
    <div id="root"></div>

    <!-- 
      Ce fichier HTML sert de modèle pour l'application React.
      Lors du développement, React injecte dynamiquement les composants ici.
      Lors du build, les scripts JavaScript minifiés sont automatiquement ajoutés.
      
      Pour démarrer l'application en mode développement : `npm start` ou `yarn start`.
      Pour générer un build de production : `npm run build` ou `yarn build`.
    -->
  </body>
</html>
